[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sf-smartllmcost"
version = "0.1.0"
description = "Apples-to-apples LLM cost & performance benchmark — cost per successful task, reproducible."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "SmartTasks" }]
keywords = ["llm", "benchmark", "cost", "latency", "true-cost", "evaluation", "finops"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]
dependencies = []
license-files = ["LICENSE", "NOTICE"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
sf-smartllmcost = "sf_smartllmcost.cli:_entry"

[project.urls]
Homepage = "https://github.com/SmartTasksOrg/sf-smartllmcost"
Source = "https://github.com/SmartTasksOrg/sf-smartllmcost"
Issues = "https://github.com/SmartTasksOrg/sf-smartllmcost/issues"
Security = "https://github.com/SmartTasksOrg/sf-smartllmcost/security/policy"
Changelog = "https://github.com/SmartTasksOrg/sf-smartllmcost/blob/master/CHANGELOG.md"
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sf_smartllmcost = ["py.typed"]
