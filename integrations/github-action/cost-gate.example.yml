# SmartLLMCost cost/latency gate — fail a PR if $/successful-task or p95 latency regress.
name: SmartLLMCost cost gate
on: [pull_request]
jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1, read 2026-10-08
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0, read 2026-10-08
        with: { python-version: "3.11" }
      # Install SmartLLMCost from its repository at a fixed commit, never by name:
      # "sf-smartllmcost" is not published on PyPI by the maintainers yet. The next
      # step gives your API key to the program installed here, so pin it.
      # pinned to the release tag v0.1.0 (it exists after the first release); sf-smartllmcost is not on PyPI yet
      - run: python -m pip install "git+https://github.com/SmartTasksOrg/sf-smartllmcost@v0.1.0"
      - run: sf-smartllmcost run taskpack.json --preset openai --model gpt-4o -o report.json
        env:
          SMARTBENCH_API_KEY: ${{ secrets.LLM_API_KEY }}
      - name: enforce budget
        run: |
          python - <<'PY'
          import json,sys
          r=json.load(open("report.json"))
          cps=r["headline"]["cost_per_successful_task"] or 9e9
          p95=r["latency_ms"]["p95"] or 9e9
          budget_cost=float("${{ vars.MAX_COST_PER_TASK || '0.05' }}")
          budget_p95=float("${{ vars.MAX_P95_MS || '20000' }}")
          bad = cps>budget_cost or p95>budget_p95
          print(f"$/task={cps} (budget {budget_cost}) p95={p95}ms (budget {budget_p95})")
          sys.exit(1 if bad else 0)
          PY
